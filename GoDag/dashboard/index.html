<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoDag Dashboard</title>
<style>
/* --- Tokens: Mission Control (Dark) --- */
[data-theme="dark"]{
  --canvas:#0a0e14;--surf-1:#111820;--surf-2:#1a2230;--surf-3:#222d3d;
  --ink:#c5d1de;--ink-2:#8294a8;--ink-3:#5a6d82;--ink-m:#3d4f63;
  --edge:rgba(56,139,253,.08);--edge-2:rgba(56,139,253,.15);--edge-s:rgba(56,139,253,.25);
  --accent:#4493f8;--accent-d:rgba(68,147,248,.12);
  --ok:#3fb950;--ok-d:rgba(63,185,80,.10);
  --warn:#d4a72c;--warn-d:rgba(212,167,44,.10);
  --danger:#f85149;--danger-d:rgba(248,81,73,.10);
  --lift:0 1px 3px rgba(0,0,0,.4);
}
/* --- Tokens: Blueprint (Light) --- */
[data-theme="light"]{
  --canvas:#f4f0e8;--surf-1:#faf7f2;--surf-2:#ece7de;--surf-3:#e0dbd0;
  --ink:#2c2416;--ink-2:#6b5d4d;--ink-3:#8a7e6e;--ink-m:#b5aa9a;
  --edge:rgba(60,50,40,.10);--edge-2:rgba(60,50,40,.18);--edge-s:rgba(60,50,40,.30);
  --accent:#2563eb;--accent-d:rgba(37,99,235,.07);
  --ok:#16a34a;--ok-d:rgba(22,163,74,.07);
  --warn:#ca8a04;--warn-d:rgba(202,138,4,.07);
  --danger:#dc2626;--danger-d:rgba(220,38,38,.07);
  --lift:0 1px 4px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--canvas);color:var(--ink);min-width:900px;overflow-x:hidden;transition:background .3s,color .3s}
a{color:var(--accent)}
/* --- Header --- */
.header{padding:14px 24px;background:var(--surf-1);border-bottom:1px solid var(--edge-2);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.logo-mark{width:16px;height:16px;background:var(--accent);transform:rotate(45deg);border-radius:3px;flex-shrink:0}
.badge{padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.badge-type{background:var(--accent-d);color:var(--accent);border:1px solid var(--edge-2)}
.badge-running{background:var(--ok-d);color:var(--ok);border:1px solid var(--ok-d)}
.badge-complete{background:var(--ok-d);color:var(--ok);border:1px solid var(--ok-d)}
.badge-failed{background:var(--danger-d);color:var(--danger);border:1px solid var(--danger-d)}
.progress-wrap{flex:1;min-width:180px;display:flex;align-items:center;gap:8px}
.progress-bar{flex:1;height:4px;background:var(--surf-3);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--ok);border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.progress-text{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:500}
.confidence{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.conf-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.conf-hi{background:var(--ok)}.conf-md{background:var(--warn)}.conf-lo{background:var(--danger)}
.timer{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:500;font-family:'SF Mono',ui-monospace,monospace}
.theme-toggle{margin-left:auto;width:32px;height:18px;border-radius:9px;background:var(--surf-3);border:1px solid var(--edge-2);cursor:pointer;position:relative;transition:background .2s}
.theme-toggle::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--ink-3);transition:transform .2s}
[data-theme="light"] .theme-toggle::after{transform:translateX(14px)}
/* --- Layout --- */
.main{display:flex;height:calc(100vh - 49px)}
.dag-area{flex:1;position:relative;overflow:auto;padding:24px}
.sidebar{width:300px;border-left:1px solid var(--edge-2);display:flex;flex-direction:column;background:var(--surf-1)}
/* --- DAG --- */
.dag-container{position:relative;min-height:100%}
svg.edges{position:absolute;top:0;left:0;pointer-events:none}
.node{position:absolute;width:220px;padding:12px 14px;background:var(--surf-2);border:1px solid var(--edge-2);border-radius:6px;cursor:pointer;transition:border-color .2s,box-shadow .2s,background .2s;box-shadow:var(--lift)}
.node:hover{border-color:var(--ink-m);box-shadow:var(--lift),0 0 0 1px var(--edge-2)}
.node.pending{border-left:3px solid var(--ink-m)}
.node.blocked{border-left:3px dashed var(--ink-m);opacity:.7}
.node.in_progress{border-left:3px solid var(--accent);background:var(--accent-d);animation:npulse 2.5s ease-in-out infinite}
.node.done-pass{border-left:3px solid var(--ok);background:var(--ok-d)}
.node.done-fail{border-left:3px solid var(--danger);background:var(--danger-d)}
@keyframes npulse{0%,100%{box-shadow:var(--lift),0 0 0 0 var(--accent-d)}50%{box-shadow:var(--lift),0 0 0 4px var(--accent-d)}}
.node-title{font-size:12px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:7px;letter-spacing:-.01em}
.node-meta{font-size:10px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap}
/* --- Signal Indicators --- */
.sig{width:8px;height:8px;border-radius:50%;flex-shrink:0;position:relative;display:inline-block}
.sig-pending{border:1.5px solid var(--ink-m);background:transparent}
.sig-blocked{border:1.5px dashed var(--ink-m);background:transparent}
.sig-run{border:2px solid transparent;border-top-color:var(--accent);border-right-color:var(--accent);background:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sig-pass{background:var(--ok)}.sig-pass::after{content:'';position:absolute;top:1px;left:2px;width:3px;height:5px;border:solid var(--surf-1);border-width:0 1.5px 1.5px 0;transform:rotate(40deg)}
.sig-fail{background:var(--danger)}.sig-fail::after,.sig-fail::before{content:'';position:absolute;top:1px;left:3px;width:0;height:5px;border-left:1.5px solid var(--surf-1)}.sig-fail::after{transform:rotate(45deg)}.sig-fail::before{transform:rotate(-45deg)}
/* --- Sidebar --- */
.feed-header{padding:12px 16px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--edge)}
.feed{flex:1;overflow-y:auto;padding:4px 0}
.feed-item{padding:7px 16px;font-size:11px;color:var(--ink-3);border-bottom:1px solid var(--edge);display:flex;gap:6px;align-items:baseline;line-height:1.4}
.feed-item .ts{color:var(--ink-m);font-family:'SF Mono',ui-monospace,monospace;font-size:10px;flex-shrink:0}
.feed-item .ev{color:var(--accent);font-weight:500;flex-shrink:0}
/* --- Detail Panel --- */
.detail-panel{display:none;border-top:1px solid var(--edge-2);max-height:50%;overflow-y:auto;padding:16px;background:var(--surf-1)}
.detail-panel.open{display:block}
.detail-panel h3{font-size:13px;font-weight:600;margin-bottom:10px;letter-spacing:-.01em}
.detail-panel .field{font-size:11px;color:var(--ink-3);margin-bottom:5px;line-height:1.5}
.detail-panel .field b{color:var(--ink-2);font-weight:500}
.detail-panel pre{font-size:10px;font-family:'SF Mono',ui-monospace,monospace;background:var(--canvas);color:var(--ink-2);padding:10px;border-radius:4px;overflow-x:auto;margin-top:6px;white-space:pre-wrap;border:1px solid var(--edge);line-height:1.5}
/* --- Overlays --- */
.conn-lost{display:none;position:fixed;top:0;left:0;right:0;padding:8px;background:var(--danger);color:#fff;text-align:center;font-size:12px;font-weight:500;z-index:99}
.conn-lost.show{display:block}
.banner{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:6px;font-size:13px;font-weight:600;z-index:99;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.banner.show{display:block}
.banner.complete{background:var(--ok);color:#fff}
.banner.failed{background:var(--danger);color:#fff}
</style>
</head>
<body>
<div class="conn-lost" id="connLost">连接已断开 — server 可能已关闭</div>
<div class="banner" id="banner"></div>
<div class="header">
  <div class="logo"><div class="logo-mark"></div>GoDag</div>
  <span class="badge badge-type" id="intentType">-</span>
  <span class="badge" id="statusBadge">-</span>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-text" id="progressText">0/0</span>
  </div>
  <div class="confidence" id="confidence"></div>
  <div class="timer" id="timer">00:00</div>
  <div class="theme-toggle" id="themeToggle" title="切换主题"></div>
</div>
<div class="main">
  <div class="dag-area" id="dagArea">
    <svg class="edges" id="edgesSvg"></svg>
    <div class="dag-container" id="dagContainer"></div>
  </div>
  <div class="sidebar">
    <div class="feed-header">Activity</div>
    <div class="feed" id="feed"></div>
    <div class="detail-panel" id="detailPanel"></div>
  </div>
</div>
<script>
let state=null,pollInterval=null,startedAt=null,selectedTask=null;
const html=document.documentElement,toggle=document.getElementById('themeToggle');
const saved=localStorage.getItem('godag-theme');
if(saved)html.setAttribute('data-theme',saved);
toggle.onclick=()=>{const n=html.getAttribute('data-theme')==='dark'?'light':'dark';html.setAttribute('data-theme',n);localStorage.setItem('godag-theme',n)};

async function poll(){
  try{
    const res=await fetch('/state.json?'+Date.now());
    state=await res.json();
    document.getElementById('connLost').classList.remove('show');
    renderHeader();renderDAG();renderFeed();
    if(selectedTask)renderDetail(selectedTask);
    if(state.meta.status==='complete'||state.meta.status==='failed'){clearInterval(pollInterval);showBanner()}
  }catch(e){document.getElementById('connLost').classList.add('show')}
}

function renderHeader(){
  const m=state.meta,c=state.confidence;
  document.getElementById('intentType').textContent=m.intent_type;
  const sb=document.getElementById('statusBadge');
  sb.textContent=m.status;
  sb.className='badge badge-'+(m.status==='running'?'running':m.status==='complete'?'complete':'failed');
  const taskIds=Object.keys(state.tasks);
  const done=taskIds.filter(id=>state.tasks[id].status==='done').length;
  document.getElementById('progressFill').style.width=(done/taskIds.length*100)+'%';
  document.getElementById('progressText').textContent=done+'/'+taskIds.length;
  if(c){
    const cls=c.score>=80?'conf-hi':c.score>=60?'conf-md':'conf-lo';
    document.getElementById('confidence').innerHTML='<span class="conf-dot '+cls+'"></span>'+c.score+'%';
  }
  if(!startedAt&&m.started_at)startedAt=new Date(m.started_at);
  updateTimer();
}

function updateTimer(){
  if(!startedAt)return;
  const end=state&&(state.meta.status==='complete'||state.meta.status==='failed')?new Date(state.meta.updated_at):new Date();
  const s=Math.floor((end-startedAt)/1000);
  document.getElementById('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
setInterval(updateTimer,1000);
function layoutDAG(tasks,edges){
  const levels={},adj={},inDeg={};
  tasks.forEach(t=>{adj[t.id]=[];inDeg[t.id]=0});
  edges.forEach(([f,t])=>{adj[f].push(t);inDeg[t]++});
  const memo={};
  function depth(id){
    if(memo[id]!==undefined)return memo[id];
    const parents=edges.filter(([,t])=>t===id).map(([f])=>f);
    memo[id]=parents.length===0?0:Math.max(...parents.map(p=>depth(p)))+1;
    return memo[id];
  }
  tasks.forEach(t=>{const l=depth(t.id);(levels[l]=levels[l]||[]).push(t.id)});
  const pos={},colW=270,rowH=90;
  Object.keys(levels).sort((a,b)=>a-b).forEach(l=>{
    const ids=levels[l],totalH=ids.length*rowH;
    ids.forEach((id,i)=>{pos[id]={x:l*colW+40,y:(i*rowH)+(400-totalH)/2}});
  });
  return pos;
}

function renderDAG(){
  const container=document.getElementById('dagContainer'),svg=document.getElementById('edgesSvg');
  const dagTasks=state.dag.tasks,edges=state.dag.edges||[];
  const pos=layoutDAG(dagTasks,edges);
  let maxX=0,maxY=0;
  Object.values(pos).forEach(p=>{maxX=Math.max(maxX,p.x+240);maxY=Math.max(maxY,p.y+80)});
  svg.setAttribute('width',maxX);svg.setAttribute('height',maxY);
  container.style.minWidth=maxX+'px';container.style.minHeight=maxY+'px';

  svg.innerHTML=edges.map(([f,t])=>{
    const fp=pos[f],tp=pos[t];
    if(!fp||!tp)return '';
    const x1=fp.x+220,y1=fp.y+35,x2=tp.x,y2=tp.y+35,cx=(x1+x2)/2;
    return `<path d="M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}" fill="none" stroke="var(--edge-s)" stroke-width="1.5"/>`;
  }).join('');

  container.innerHTML='';
  dagTasks.forEach(dt=>{
    const ts=state.tasks[dt.id]||{},p=pos[dt.id];
    if(!p)return;
    const cls=ts.status==='done'?(ts.acceptance_passed!==false?'done-pass':'done-fail'):(ts.status||'pending');
    const sc=ts.status==='done'?(ts.acceptance_passed!==false?'sig-pass':'sig-fail'):ts.status==='in_progress'?'sig-run':ts.status==='blocked'?'sig-blocked':'sig-pending';
    const dur=ts.duration_s?Math.floor(ts.duration_s/60)+'m'+(ts.duration_s%60)+'s':'';
    const node=document.createElement('div');
    node.className='node '+cls;
    node.style.left=p.x+'px';node.style.top=p.y+'px';
    node.innerHTML=`<div class="node-title"><span class="sig ${sc}"></span>${dt.id}: ${dt.title}</div>`
      +`<div class="node-meta"><span>${dt.type}</span>${dt.agent_role?'<span>'+dt.agent_role+'</span>':''}${dur?'<span>'+dur+'</span>':''}</div>`;
    node.onclick=()=>{selectedTask=dt.id;renderDetail(dt.id)};
    container.appendChild(node);
  });
}
let lastFeedLen=0;
async function renderFeed(){
  try{
    const res=await fetch('/log.jsonl?'+Date.now());
    const text=await res.text();
    const lines=text.trim().split('\n').filter(Boolean);
    if(lines.length===lastFeedLen)return;
    lastFeedLen=lines.length;
    document.getElementById('feed').innerHTML=lines.reverse().map(line=>{
      try{
        const e=JSON.parse(line);
        const t=e.ts?e.ts.substring(11,19):'';
        const info=e.data?Object.entries(e.data).map(([k,v])=>k+'='+v).join(' '):'';
        return `<div class="feed-item"><span class="ts">${t}</span><span class="ev">${e.event}</span>${info}</div>`;
      }catch{return ''}
    }).join('');
  }catch{}
}

function renderDetail(taskId){
  const panel=document.getElementById('detailPanel');
  const dt=state.dag.tasks.find(t=>t.id===taskId);
  const ts=state.tasks[taskId];
  if(!dt||!ts){panel.classList.remove('open');return}
  panel.classList.add('open');
  let h=`<h3>${dt.id}: ${dt.title}</h3>`;
  h+=`<div class="field"><b>Type:</b> ${dt.type} · <b>Complexity:</b> ${dt.estimated_complexity}</div>`;
  h+=`<div class="field"><b>Scope:</b> ${Array.isArray(dt.scope)?dt.scope.join(', '):dt.scope}</div>`;
  h+=`<div class="field"><b>Role:</b> ${dt.agent_role}</div>`;
  h+=`<div class="field"><b>Status:</b> ${ts.status}${ts.agent?' · <b>Agent:</b> '+ts.agent:''}</div>`;
  h+=`<div class="field"><b>Retries:</b> ${ts.retries}</div>`;
  if(ts.duration_s!=null)h+=`<div class="field"><b>Duration:</b> ${Math.floor(ts.duration_s/60)}m${ts.duration_s%60}s</div>`;
  if(ts.files_changed&&ts.files_changed.length)h+=`<div class="field"><b>Files:</b> ${ts.files_changed.join(', ')}</div>`;
  if(ts.summary)h+=`<div class="field"><b>Summary:</b> ${ts.summary}</div>`;
  h+=`<div class="field"><b>Acceptance:</b></div><pre>${dt.acceptance}</pre>`;
  if(ts.acceptance_output)h+=`<div class="field"><b>Output:</b></div><pre>${ts.acceptance_output}</pre>`;
  panel.innerHTML=h;
}

function showBanner(){
  const b=document.getElementById('banner');
  const done=Object.values(state.tasks).filter(t=>t.status==='done'&&t.acceptance_passed!==false).length;
  const total=Object.keys(state.tasks).length;
  if(state.meta.status==='complete'){
    b.className='banner show complete';
    b.textContent=`执行完成 — ${done}/${total} 任务通过 · 置信度 ${state.confidence.score}%`;
  }else{
    b.className='banner show failed';
    b.textContent=`执行失败 — ${done}/${total} 任务通过`;
  }
}

pollInterval=setInterval(poll,2000);
poll();
</script>
</body>
</html>
